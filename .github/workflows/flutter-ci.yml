name: Flutter CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffolding if absent
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android,web --project-name brain_speed_iq .
          fi
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
